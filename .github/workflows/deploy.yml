name: Build and deploy to Azure Functions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish SchoolAssistant.csproj -c Release -o ${{ env.PUBLISH_DIR }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: functionapp
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    # PRs only get the build check above; deploys happen from main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functionapp
          path: ${{ env.PUBLISH_DIR }}

      - uses: Azure/functions-action@v1
        with:
          # Repo variable AZURE_FUNCTIONAPP_NAME; repo secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
