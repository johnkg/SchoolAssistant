name: Build and deploy to Azure Functions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish SchoolAssistant.csproj -c Release -o ${{ env.PUBLISH_DIR }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: functionapp
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    # PRs only get the build check above; deploys happen from main.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets azure/login exchange the GitHub token for an Azure one (OIDC)
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functionapp
          path: ${{ env.PUBLISH_DIR }}

      # Flex Consumption does not support publish profiles, so sign in with OIDC.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
          sku: flexconsumption
